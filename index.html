<head>
    <meta charset="utf-8">

    <link rel="icon" href="favicon.ico">

    <title>Sistema de Indices - ARP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
        integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <main class="login-shell">
        <form action="controller/autentica.php" method="post" id="form-autentica" name="form-autentica" class="caja">
            <div class="login-brand">
                <span class="seal" aria-hidden="true"></span>
                <h3>Sistema de Índices</h3>
                <p>Huancané · Archivo Regional de Puno · v0.7</p>
            </div>

            <div class="form-group">
                <label for="txt-usuario">Número de DNI</label>
                <input type="text" class="form-control" id="txt-usuario" name="txtusuario"
                    placeholder="Ingrese su DNI" maxlength="8" inputmode="numeric" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label for="txt-clave">Contraseña</label>
                <input type="password" class="form-control" id="txt-clave" name="txtpassword"
                    placeholder="••••••••" maxlength="10" autocomplete="current-password" required>
            </div>
            <input type="submit" name="btn-aceptar" class="boton" value="Ingresar">
        </form>
    </main>

    <footer>
        <p>&copy; Archivo Regional de Puno 2020–2026 · Área de Informática</p>
        <p>Encargado: Ing. Edgar Apaza Choque</p>
    </footer>

    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"
        integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous">
    </script>
</body>
</html>
